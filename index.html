<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Where do NYC's yellow cabs slow down</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="layout">
            <aside>
                <h1>Where do NYC's yellow cabs slow down?<h1>
                <p class="lede">Every trip below was cleaned, joined to its pickup zone and priced per mile. Filter the city, then read the map, the clock and the routes.</p>
                <form id="filters">
                    <label>Pickup borough
                        <select name="borough"><option value=" ">All boroughs</option><option>Manhattan</option><option>Brooklyn</option>
                            <option>Queens</option><option>Bronx</option><option>Staten Island</option><option>EWR</option>
                        </select>
                    </label>
                    <div class="pair">
                    <label>From hour<input type="number" name="hour_from" min="0" max="23" placeholder="0"></label>
                    <label>To hour<input type="number" name="hour_to" min="0" max="23" placeholder="23"></label>
                    </div>
                    <div class="pair">
                    <label>Min miles<input type="number" name="min_distance" min="0" step="0.5"></label>
                    <label>Max miles<input type="number" name="max_distance" min="0" step="0.5"></label>
                    </div>
                    <div class="pair">
                    <label>Min fare ($)<input type="number" name="min_fare" min="0"></label>
                    <label>Max fare ($)<input type="number" name="max_fare" min="0"></label>
                    </div>
                    <label>Paid by
                        <select name="payment"><option value=" ">Any method</option><option value="1">Credit card</option><option value="2">Cash</option></select>
                    </label>
                    <div class=buttons><button type="submit">Apply filters</button><button type="button" id="reset" classs="ghost">Reset</button></div>
                </form>
                <p id="ZoneChip" class="chip" hidden></p>
                <details>
                    <summary>Data Quality log</summary>
                    <p class="small">Rows removed during cleaning, by the first rule they broke.</p>
    </body>
</html>
